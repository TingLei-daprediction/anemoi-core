defaults:
  - anemoi-training-rrfs-lam-neural-lam-verify-202405-1h-refc-value-base-refc-input-no-hydrometeors-finer-graph-v1-single-input
  - _self_

config_validation: True

# Verification variant for checkpoints trained with:
#   anemoi-training-rrfs-lam-neural-lam-static-forcing-202405-1h-refc-value-base_1-refc-input-no-hydrometeors-finer-graph-v1-single-input
#
# This matches the base_1 GraphTransformer layout:
#   - refc is part of the prognostic/input state
#   - multistep_input = 1
#   - hydrometeors removed entirely
#   - landcover: none
#   - orography: max
#   - swdown: none
#   - refc: mean-std
#   - results stored under the same experiment root

data:
  datasets:
    data:
      processors:
        normalizer:
          config:
            default: "mean-std"
            std: []
            max:
              - orography
            none:
              - landcover
              - swdown

system:
  output:
    root: /scratch3/NCEPDEV/fv3-cam/Ting.Lei/tlei-anemoi-training/base_1_graphtransformer_finer_graph_v1_single_input_refc_input_no_hydrometeors/verify/

training:
  scalers:
    datasets:
      data:
        refc_range_weight_factors:
          normalization: mean-std
