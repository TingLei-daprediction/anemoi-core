# Base_1 diffusion experiment for the RRFS 1-hour no-refc-input setup using
# the finer_graph_v1 graph. This keeps the same diffusion architecture, role
# split, and refc weighting logic, but uses the base_1 forcing/static
# normalization:
#   - landcover: none
#   - orography: max
#   - swdown: none

system:
  output:
    root: /scratch3/NCEPDEV/fv3-cam/Ting.Lei/tlei-anemoi-training/base_1_diffusion_finer_graph_v1_no_refc_input/

data:
  datasets:
    data:
      processors:
        normalizer:
          config:
            default: "mean-std"
            std: []
            min-max:
              - refc
            max:
              - orography
            none:
              - landcover
              - swdown
