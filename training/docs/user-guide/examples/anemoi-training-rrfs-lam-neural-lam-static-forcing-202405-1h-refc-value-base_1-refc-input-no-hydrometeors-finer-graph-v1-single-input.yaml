# Base_1 single-input finer-graph GraphTransformer experiment:
#   - keep the direct +1h refc-value loss setup
#   - keep refc in the normal prognostic/input state
#   - remove all hydrometeor variables from both input and output
#   - use the base_1 forcing/static normalization:
#       landcover -> none
#       orography -> max
#       swdown    -> none
#       refc      -> mean-std

system:
  output:
    root: /scratch3/NCEPDEV/fv3-cam/Ting.Lei/tlei-anemoi-training/base_1_graphtransformer_finer_graph_v1_single_input_refc_input_no_hydrometeors/

data:
